name: Fleet Management CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet_dev_pwd
          POSTGRES_DB: fleet_shared
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fleet"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: fleet
          RABBITMQ_DEFAULT_PASS: fleet_dev_pwd
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore FleetManagement.sln

      - name: Build solution
        run: dotnet build FleetManagement.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test FleetManagement.sln --no-build --configuration Release --verbosity normal --logger "trx" --results-directory TestResults
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/